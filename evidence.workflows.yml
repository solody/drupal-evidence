evidence_default:
  id: evidence_default
  group: evidence
  label: 'Evidence default'
  states:
    draft:
      label: 'Draft'
    rejected:
      label: 'Rejected'
    approved:
      label: 'Approved'
  transitions:
    reject:
      label: 'Reject'
      from: [draft]
      to: rejected
    approve:
      label: 'Approve'
      from: [draft]
      to: approved
